<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Lomba Tenis Meja - Peringatan Hari Oeang ke-80 Tahun 2026, Sabtu 10 Oktober 2026, KPP Pratama Padang Satu. Coming soon.">
<title>Lomba Tenis Meja Hari Oeang 80</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Figtree:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: satu layar penuh, rata kiri. Latar kuning cerah dengan stiker, tulisan raksasa "Coming Soon...", hitung mundur, raket dan bola memantul. */
:root{
  --hero:#FFD23F; --ink:#1E1B3A; --muted:#4E4310; --surface:#FFFFFF; --edge:#1E1B3A; --sh:#1E1B3A;
  --hot:#FF5D2E; --lilac:#CDBFFF; --mint:#19C3A0; --ball:#FFFFFF;
  --f-display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"DM Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --hero:#3A2C8C; --ink:#F6F3FF; --muted:#D6CFFA; --surface:#221C45; --edge:#8B7BF0; --sh:#0A0716;
    --hot:#FF7A52; --lilac:#4A3E9E; --mint:#3DDBB8;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --hero:#3A2C8C; --ink:#F6F3FF; --muted:#D6CFFA; --surface:#221C45; --edge:#8B7BF0; --sh:#0A0716;
  --hot:#FF7A52; --lilac:#4A3E9E; --mint:#3DDBB8;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0}
html,body{height:100%}
body{background:var(--hero);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
h1,p{margin:0}
.stage{position:relative;min-height:100%;overflow:hidden;display:grid;align-items:center;padding-inline:20px;padding-block:32px}
.art{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;color:var(--ink)}
.s-l{fill:var(--lilac)} .s-m{fill:var(--mint)}
.s-sq{fill:none;stroke:var(--hot);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.pd-b{fill:var(--hot);stroke:var(--ink);stroke-width:4}
.pd-h{fill:var(--ink)}
.bl{fill:var(--ball);stroke:var(--ink);stroke-width:3}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-34px)}}
.ball{animation:bounce 1.1s cubic-bezier(.3,0,.7,1) infinite;transform-box:fill-box}
.in{position:relative;width:100%;max-width:720px;margin-inline:auto;display:grid;gap:20px;justify-items:start}
.kicker{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;background:var(--ink);color:var(--hero);padding:6px 12px;border-radius:8px;transform:rotate(-1.5deg)}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(52px,15vw,132px);line-height:.92;letter-spacing:-.035em;text-wrap:balance}
h1 .dots span{display:inline-block;animation:blink 1.4s infinite}
h1 .dots span:nth-child(2){animation-delay:.2s}
h1 .dots span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,60%,100%{opacity:1}30%{opacity:.15}}
.sub{font-family:var(--f-display);font-weight:700;font-size:clamp(22px,5vw,32px);line-height:1.15}
.meta{display:flex;flex-wrap:wrap;gap:4px 16px;color:var(--muted);font-weight:700}
.cd{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;width:100%;max-width:420px}
.cd div{background:var(--surface);color:var(--ink);border:2px solid var(--edge);border-radius:14px;box-shadow:3px 3px 0 var(--sh);padding:10px 4px 8px;text-align:center}
.cd .num{display:block;font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:clamp(26px,7vw,34px);font-weight:500;line-height:1.05}
.cd small{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.cd-note{color:var(--muted);font-weight:600;font-size:14px}
.cd-note b{color:var(--ink);font-weight:800}
.hint{max-width:34ch;color:var(--muted);font-weight:600}
@media (prefers-reduced-motion: reduce){
  .ball,h1 .dots span{animation:none}
}
</style>
</head>
<body>
<main class="stage">
  <svg class="art" viewBox="0 0 800 420" preserveAspectRatio="xMaxYMid slice" aria-hidden="true">
    <circle class="s-l" cx="700" cy="80" r="76"/>
    <circle class="s-m" cx="70" cy="370" r="34"/>
    <path class="s-sq" d="M36 64 q14 -24 28 0 t28 0 t28 0 t28 0"/>
    <g stroke="currentColor" stroke-opacity=".16" fill="none" stroke-width="3">
      <rect x="60" y="60" width="680" height="300" rx="10"/>
      <line x1="400" y1="60" x2="400" y2="360" stroke-dasharray="2 10" stroke-linecap="round"/>
    </g>
    <g transform="translate(676 262) rotate(-28)"><rect class="pd-h" x="-10" y="40" width="20" height="56" rx="7"/><circle class="pd-b" r="50"/></g>
    <g class="ball"><circle class="bl" cx="560" cy="330" r="15"/></g>
  </svg>

  <div class="in">
    <p class="kicker">Peringatan Hari Oeang ke-80 &middot; 2026</p>
    <h1>Coming Soon<span class="dots" aria-hidden="true"><span>.</span><span>.</span><span>.</span></span></h1>
    <p class="sub">Lomba Tenis Meja</p>
    <p class="meta"><span>Sabtu, 10 Oktober 2026</span><span>KPP Pratama Padang Satu</span></p>
    <div>
      <div class="cd" id="cd" role="timer" aria-live="off">
        <div><span class="num" id="cd-d">00</span><small>Hari</small></div>
        <div><span class="num" id="cd-h">00</span><small>Jam</small></div>
        <div><span class="num" id="cd-m">00</span><small>Menit</small></div>
        <div><span class="num" id="cd-s">00</span><small>Detik</small></div>
      </div>
      <p class="cd-note" id="cd-note" style="margin-top:10px"></p>
    </div>
    <p class="hint">Jadwal, hasil, dan informasi lomba segera hadir di halaman ini.</p>
  </div>
</main>

<script>
(function () {
  const target = new Date("2026-10-10T00:00:00+07:00").getTime();
  const pad = n => String(n).padStart(2, "0");
  const set = (id, v) => { document.getElementById(id).textContent = v; };
  function tick() {
    const diff = target - Date.now();
    const note = document.getElementById("cd-note");
    if (diff <= 0) {
      ["d", "h", "m", "s"].forEach(k => set("cd-" + k, "00"));
      note.innerHTML = "<b>Hari pertandingan.</b> Selamat bertanding!";
      return;
    }
    const s = Math.floor(diff / 1000);
    set("cd-d", pad(Math.floor(s / 86400)));
    set("cd-h", pad(Math.floor(s % 86400 / 3600)));
    set("cd-m", pad(Math.floor(s % 3600 / 60)));
    set("cd-s", pad(s % 60));
    note.innerHTML = "menuju <b>Sabtu, 10 Oktober 2026</b>";
  }
  tick(); setInterval(tick, 1000);
})();
</script>
</body>
</html>
